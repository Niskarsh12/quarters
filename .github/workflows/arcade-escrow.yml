name: Build arcade escrow
on:
  workflow_dispatch:
  push:
    paths:
      - contracts/arcade_escrow/**
      - .github/workflows/arcade-escrow.yml
jobs:
  wasm:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: contracts/arcade_escrow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-escrow-wasm
          path: contracts/arcade_escrow/build/arcade_escrow.wasm
