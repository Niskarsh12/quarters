name: Build PaperHands Arena
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:arena
      - run: npm run build
      - run: npm run build:contract
      - name: Verify WASM entry points
        run: |
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const wasm = new WebAssembly.Module(readFileSync("build/paperhands_arena.wasm"));
          const names = new Set(WebAssembly.Module.exports(wasm).map(entry => entry.name));
          for (const name of ["init", "open_arena", "enter_arena", "hold_arena", "flee_arena",
            "advance_arena", "get_arena", "get_credit", "withdraw", "finish_withdraw"]) {
            assert(names.has(name), `Missing WASM entry point ${name}`);
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: paperhands-arena-wasm
          path: build/paperhands_arena.wasm
          if-no-files-found: error
